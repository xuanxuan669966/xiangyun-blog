---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <div class="meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
    {% if page.categories %}
      <span> · 分类: {{ page.categories | join: ", " }}</span>
    {% endif %}
  </div>
  <div class="content">
    {{ content }}
  </div>
  <div class="tags">
    {% for tag in page.tags %}
      <a href="/tags/{{ tag }}" class="tag">#{{ tag }}</a>
    {% endfor %}
  </div>
  {% include comment.html %}
</article>
